name: Visit-With-Us Tourism MLOps Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on every push to the main branch
  workflow_dispatch:  # Allows manual trigger from the GitHub Actions UI

jobs:

  # ---------------------------------------------------------------
  # JOB 1: Register the raw dataset on Hugging Face Dataset Space
  # ---------------------------------------------------------------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          pip install huggingface_hub datasets pandas
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python scripts/register_dataset.py

  # ---------------------------------------------------------------
  # JOB 2: Data preparation — clean, split, upload train/test to HF
  # ---------------------------------------------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          pip install huggingface_hub datasets pandas scikit-learn
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python scripts/data_preparation.py

  # ---------------------------------------------------------------
  # JOB 3: Train models, track with MLflow, register best on HF
  # ---------------------------------------------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          pip install huggingface_hub datasets pandas scikit-learn xgboost mlflow
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5
      - name: Model Building
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: python scripts/train_model.py
      - name: Model Evaluation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python scripts/evaluate_model.py

  # ---------------------------------------------------------------
  # JOB 4: Deploy Streamlit app to Hugging Face Space
  # ---------------------------------------------------------------
  deploy-hosting:
    runs-on: ubuntu-latest
    needs: [model-training, data-prep, register-dataset]
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: |
          pip install huggingface_hub
      - name: Push Files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: python scripts/deploy.py

  # ---------------------------------------------------------------
  # Auto-push any code updates back to the main branch
  # ---------------------------------------------------------------
  auto-push:
    runs-on: ubuntu-latest
    needs: deploy-hosting
    steps:
      - uses: actions/checkout@v3
      - name: Commit and Push Code Updates to Main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "[CI] Auto-update: pipeline run $(date '+%Y-%m-%d %H:%M')"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
